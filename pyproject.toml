[project]
name = "toxinator-game-horror-karting"
version = "1.0.0"
description = "Karting de terror con 8 monstruos, volante físico y pantalla dividida."
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horror_karting"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
